- name: Deploy Pods on Docker Container
  hosts: all
  tasks:
    - name: Apt Update
      apt:
        update_cache: yes
      ignore_errors: yes   # prevents failure if a bad repo exists on Azure

    - name: Install Docker
      apt:
        name: docker.io
        state: latest
        update_cache: yes

    - name: Stop existing container if running
      command: "docker stop {{ containerName }}"
      ignore_errors: yes

    - name: Remove existing container if present
      command: "docker rm -f {{ containerName }}"
      ignore_errors: yes

    - name: Deploy new container {{ dockerImageTag }}
      command: >
        docker run -d
        --name {{ containerName }}
        --restart unless-stopped
        -p {{ httpPort }}:{{ httpPort }}
        docker.io/{{ dockerImageTag }}

    - name: Get running containers
      command: "docker ps"

    - name: Prune unused Docker images
      command: "docker image prune -f"
      ignore_errors: yes
